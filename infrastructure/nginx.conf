server {
    listen 80;
    server_name atlasmassage.com www.atlasmassage.com;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name atlasmassage.com www.atlasmassage.com;

    # TLS certificates managed by Cloudflare / certbot
    ssl_certificate     /etc/ssl/certs/atlasmassage.crt;
    ssl_certificate_key /etc/ssl/private/atlasmassage.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # Security headers
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy strict-origin-when-cross-origin;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload";

    # Static frontend
    root /var/www/atlasmassage/web;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # API proxy
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    # Uploaded and seeded assets. These are Express static routes on the API,
    # not files under the web root, so they need proxying just like /api/ —
    # without this they fall through to the SPA fallback below and every image
    # request answers 200 text/html with the index.html shell.
    #
    # Regex location so both paths share one block; it takes precedence over the
    # `location /` prefix match regardless of ordering.
    location ~ ^/(headshots|essays/images)/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # Replacing an image always writes a new generated filename and updates
        # the row that points at it, so a live URL's bytes never change and can
        # be cached hard. express.static still passes ETag/Last-Modified through,
        # so clients revalidate cheaply once this expires.
        #
        # Deliberately `expires` rather than `add_header Cache-Control`: a single
        # add_header here would discard every inherited one, silently stripping
        # nosniff and HSTS from these responses.
        expires 30d;
    }

    # Health check
    location /health {
        proxy_pass http://127.0.0.1:3001;
        access_log off;
    }
}
